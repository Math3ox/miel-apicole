name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint & Tests
    runs-on: ubuntu-latest

    env:
      # DSN factice : les tests ne se connectent pas à la base, mais le kernel
      # a besoin que la variable soit définie pour démarrer.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/apiculteur_test?serverVersion=8.0&charset=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, pdo_mysql, intl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint YAML config
        run: php bin/console lint:yaml config

      - name: Lint service container
        run: php bin/console lint:container

      - name: Run PHPUnit
        run: php vendor/bin/phpunit
